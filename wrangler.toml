# ============================================================
# NIVORA - configuração do Cloudflare Pages
# Frontend estático + Pages Functions em /api/* + D1 + Workers AI
# Marca: Aprenda. Supere. Evolua.
# ============================================================

name = "nivora"
pages_build_output_dir = "."

compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Banco de dados D1 (pré-criado: wrangler d1 create quiz-ake-db)
[[d1_databases]]
binding = "DB"
database_name = "quiz-ake-db"
database_id = "b9df1729-4395-459a-a844-c948c684437e"

# --- Variáveis públicas (não secretas) ---
[vars]
ENVIRONMENT = "development"
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
SITE_URL = "https://quiz-ake-v2.pages.dev"
SCORING_CORRECT = "100"
SCORING_SPEED_MAX = "20"

# Workers AI (opcional, usado pela camada AIService em simulados)
# [ai]
# binding = "AI"